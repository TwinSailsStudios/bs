<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brimstone IDE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
    background: #1e1e1e;
    color: #d4d4d4;
    overflow: hidden;
  }

  body.light {
    background: #ffffff;
    color: #333333;
  }

  /* Top bar */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: #252526;
    border-bottom: 1px solid #3e3e42;
    flex: none;
  }

  body.light #topbar {
    background: #f3f3f3;
    border-bottom-color: #e0e0e0;
  }

  #topbar input {
    background: #3c3c3c;
    color: #d4d4d4;
    border: 1px solid #555555;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 12px;
    width: 140px;
  }

  body.light #topbar input {
    background: #ffffff;
    color: #333333;
    border-color: #cccccc;
  }

  #topbar button, #topbar label {
    background: #0e639c;
    color: #ffffff;
    border: none;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }

  #topbar button:hover {
    background: #1177bb;
  }

  body.light #topbar button, body.light #topbar label {
    background: #0e639c;
  }

  #topbar label { display: inline-flex; }
  #topbar label input[type="file"] { display: none; }

  .spacer { flex: 1; }

  #themeToggle {
    background: #555555;
    padding: 4px 8px;
  }

  #themeToggle:hover {
    background: #666666;
  }

  body.light #themeToggle:hover {
    background: #cccccc;
  }

  /* Main split */
  #main {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 1px;
    background: #3e3e42;
  }

  /* Editor section */
  #editorSection {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    background: #1e1e1e;
  }

  body.light #editorSection {
    background: #ffffff;
  }

  #editorContainer {
    display: flex;
    flex: 1;
    min-height: 0;
    position: relative;
  }

  #gutter {
    background: #1e1e1e;
    color: #6a6a6a;
    padding: 0 8px;
    text-align: right;
    user-select: none;
    flex: none;
    width: 44px;
    overflow: hidden;
    border-right: 1px solid #3e3e42;
    font-size: 12px;
  }

  body.light #gutter {
    background: #ffffff;
    color: #999999;
    border-right-color: #e0e0e0;
  }

  #editor {
    flex: 1;
    background: transparent;
    color: #d4d4d4;
    border: none;
    outline: none;
    resize: none;
    padding: 0 12px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre;
    overflow-wrap: normal;
    caret-color: #aeafad;
  }

  body.light #editor {
    color: #333333;
    caret-color: #666666;
  }

  #editor::selection {
    background: #264f78;
  }

  body.light #editor::selection {
    background: #add6ff;
  }

  /* Output section */
  #outputSection {
    display: flex;
    flex-direction: column;
    flex: 0 0 200px;
    background: #1e1e1e;
    border-top: 1px solid #3e3e42;
  }

  body.light #outputSection {
    background: #ffffff;
    border-top-color: #e0e0e0;
  }

  #outputLabel {
    padding: 4px 12px;
    background: #252526;
    border-bottom: 1px solid #3e3e42;
    color: #cccccc;
    font-size: 12px;
    font-weight: bold;
    flex: none;
  }

  body.light #outputLabel {
    background: #f3f3f3;
    border-bottom-color: #e0e0e0;
    color: #333333;
  }

  #output {
    flex: 1;
    overflow: auto;
    padding: 8px 12px;
    font-size: 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  #output .ok { color: #4ec9b0; }
  #output .err { color: #f48771; }
  #output .sys { color: #6a6a6a; }

  body.light #output .ok { color: #0a7e3d; }
  body.light #output .err { color: #a1260d; }
  body.light #output .sys { color: #999999; }

  /* Converter modal */
  #converterModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #converterModal.show {
    display: flex;
  }

  #converterBox {
    background: #1e1e1e;
    border: 1px solid #3e3e42;
    border-radius: 4px;
    width: 90%;
    max-width: 900px;
    height: 80%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  body.light #converterBox {
    background: #ffffff;
    border-color: #e0e0e0;
  }

  #converterBox header {
    padding: 12px;
    border-bottom: 1px solid #3e3e42;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #252526;
  }

  body.light #converterBox header {
    background: #f3f3f3;
    border-bottom-color: #e0e0e0;
  }

  #converterBox h2 {
    font-size: 14px;
    color: #d4d4d4;
  }

  body.light #converterBox h2 {
    color: #333333;
  }

  #converterBox .close-btn {
    background: none;
    border: none;
    color: #d4d4d4;
    cursor: pointer;
    font-size: 18px;
  }

  body.light #converterBox .close-btn {
    color: #333333;
  }

  #converterBody {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 1px;
    background: #3e3e42;
  }

  .converter-pane {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  .converter-pane-label {
    padding: 4px 8px;
    background: #252526;
    border-bottom: 1px solid #3e3e42;
    font-size: 11px;
    color: #999999;
    flex: none;
  }

  body.light .converter-pane-label {
    background: #f3f3f3;
    border-bottom-color: #e0e0e0;
    color: #666666;
  }

  .converter-textarea {
    flex: 1;
    background: #1e1e1e;
    color: #d4d4d4;
    border: none;
    padding: 8px;
    font-family: inherit;
    font-size: 12px;
    resize: none;
    outline: none;
  }

  body.light .converter-textarea {
    background: #ffffff;
    color: #333333;
  }

  #converterArrow {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    flex: none;
  }

  #converterArrow button {
    background: #0e639c;
    color: #ffffff;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    margin: 2px;
  }

  #converterArrow button:hover {
    background: #1177bb;
  }

  body.light #converterArrow button {
    background: #0e639c;
  }

  #converterFooter {
    padding: 8px;
    border-top: 1px solid #3e3e42;
    background: #252526;
    display: flex;
    gap: 6px;
  }

  body.light #converterFooter {
    background: #f3f3f3;
    border-top-color: #e0e0e0;
  }

  #converterFooter button {
    background: #0e639c;
    color: #ffffff;
    border: none;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
  }

  #converterFooter button:hover {
    background: #1177bb;
  }
</style>
</head>
<body>

<div id="topbar">
  <strong>Brimstone</strong>
  <input id="filename" value="inferno.bs" spellcheck="false">
  <button onclick="compileAndRun()">▶ Run</button>
  <button onclick="showConverter()">⇄ Convert</button>
  <button onclick="saveFile()">↓ Save</button>
  <label>↑ Load <input type="file" id="loader" accept=".bs,.py,.txt"></label>
  <span class="spacer"></span>
  <button id="themeToggle" onclick="toggleTheme()">☀</button>
</div>

<div id="main">
  <div id="editorSection">
    <div id="editorContainer">
      <div id="gutter">1</div>
      <textarea id="editor" spellcheck="false"
        placeholder="summon math&#10;rite hello():&#10;    manifest('compiling...')&#10;hello()"></textarea>
    </div>
  </div>

  <div id="outputSection">
    <div id="outputLabel">Output</div>
    <div id="output"><span class="sys">Ready.</span></div>
  </div>
</div>

<!-- Converter Modal -->
<div id="converterModal">
  <div id="converterBox">
    <header>
      <h2>Converter</h2>
      <button class="close-btn" onclick="hideConverter()">✕</button>
    </header>
    <div id="converterBody">
      <div class="converter-pane">
        <div class="converter-pane-label">Python</div>
        <textarea id="converterPy" class="converter-textarea" spellcheck="false"
          placeholder="Paste Python code here..."></textarea>
      </div>
      <div id="converterArrow">
        <button onclick="pyToBs()">→</button>
        <button onclick="bsToPy()">←</button>
      </div>
      <div class="converter-pane">
        <div class="converter-pane-label">Brimstone</div>
        <textarea id="converterBs" class="converter-textarea" spellcheck="false"
          placeholder="Paste Brimstone code here..."></textarea>
      </div>
    </div>
    <div id="converterFooter">
      <button onclick="copyConverterBs()">Copy BS</button>
      <button onclick="copyConverterPy()">Copy Py</button>
      <button onclick="insertConverterBsToEditor()">Insert BS to Editor</button>
      <button onclick="hideConverter()">Close</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
"use strict";
/* =========================================================================
   BRIMSTONE WEB IDE — VS Code style, text-based, with converter
   ========================================================================= */

// --- Theme management ---
function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("brimstone-theme", document.body.classList.contains("light") ? "light" : "dark");
}

(function() {
  const saved = localStorage.getItem("brimstone-theme");
  if (saved === "light") document.body.classList.add("light");
})();

// --- Translation (Brimstone → Python) ---
const KEYWORD_MAP = {
  manifest: "print", demand: "input", summon: "import", rite: "def",
  PURE: "True", CORRUPT: "False", sin: "try", atone: "except",
};

function translate(source) {
  return source.split("\n").map(line => {
    if (/\bsuffer\b.*\bin\b/.test(line)) {
      line = line.replace(/\bsuffer\b/g, "for");
    } else {
      line = line.replace(/\bsuffer\b/g, "while");
    }
    for (const [bs, py] of Object.entries(KEYWORD_MAP)) {
      line = line.replace(new RegExp("\\b" + bs + "\\b", "g"), py);
    }
    return line;
  }).join("\n");
}

// --- Reverse translation (Python → Brimstone) ---
const REVERSE_MAP = {
  "print": "manifest",
  "input": "demand",
  "import": "summon",
  "def": "rite",
  "True": "PURE",
  "False": "CORRUPT",
  "try": "sin",
  "except": "atone",
};

function reverseTranslate(source) {
  return source.split("\n").map(line => {
    // Replace "while" with "suffer" (but NOT inside for-loops)
    if (!/\bfor\b/.test(line)) {
      line = line.replace(/\bwhile\b/g, "suffer");
    }
    // Replace "for X in Y:" with "suffer X in Y:" (actually already compatible, but be explicit)
    line = line.replace(/\bfor\b/g, "suffer");

    for (const [py, bs] of Object.entries(REVERSE_MAP)) {
      line = line.replace(new RegExp("\\b" + py + "\\b", "g"), bs);
    }
    return line;
  }).join("\n");
}

// --- DOM elements ---
const editor = document.getElementById("editor");
const gutter = document.getElementById("gutter");
const output = document.getElementById("output");
const filenameInput = document.getElementById("filename");
const converterModal = document.getElementById("converterModal");
const converterPy = document.getElementById("converterPy");
const converterBs = document.getElementById("converterBs");

// --- Gutter line numbers ---
function refreshGutter() {
  const n = editor.value.split("\n").length;
  gutter.textContent = Array.from({length: n}, (_, i) => i + 1).join("\n");
  gutter.scrollTop = editor.scrollTop;
}

editor.addEventListener("scroll", () => {
  gutter.scrollTop = editor.scrollTop;
});

editor.addEventListener("input", () => {
  refreshGutter();
  autosave();
});

// --- Autosave & restore ---
const LS_KEY = "brimstone.buffer", LS_NAME = "brimstone.filename";

function autosave() {
  localStorage.setItem(LS_KEY, editor.value);
  localStorage.setItem(LS_NAME, filenameInput.value);
}

(function restore() {
  const saved = localStorage.getItem(LS_KEY);
  if (saved !== null) editor.value = saved;
  const name = localStorage.getItem(LS_NAME);
  if (name) filenameInput.value = name;
  refreshGutter();
})();

// --- File I/O ---
function saveFile() {
  let name = filenameInput.value.trim() || "inferno.bs";
  if (!name.endsWith(".bs") && !name.endsWith(".py")) name += ".bs";
  const blob = new Blob([editor.value], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("loader").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  editor.value = await f.text();
  filenameInput.value = f.name;
  refreshGutter();
  autosave();
  e.target.value = "";
});

// --- Pyodide runtime ---
let pyodidePromise = null;

function getPyodide() {
  if (!pyodidePromise) {
    pyodidePromise = loadPyodide().catch(err => {
      pyodidePromise = null;
      throw new Error("Failed to load Python: " + err);
    });
  }
  return pyodidePromise;
}

function logOutput(msg, cls) {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = msg + "\n";
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

async function compileAndRun() {
  const source = editor.value;
  const python = translate(source);

  output.textContent = "";
  logOutput("→ Translating Brimstone to Python...", "sys");
  await new Promise(r => setTimeout(r, 100));

  let py;
  try {
    py = await getPyodide();
  } catch (err) {
    logOutput(String(err), "err");
    return;
  }

  py.setStdout({batched: s => logOutput(s)});
  py.setStderr({batched: s => logOutput(s, "err")});
  py.setStdin({stdin: () => prompt("Input:") ?? ""});

  try {
    await py.runPythonAsync(python);
    logOutput("[OK] Executed successfully.", "ok");
  } catch (err) {
    logOutput("[ERROR] " + err.message, "err");
  }
}

// --- Converter ---
function showConverter() {
  converterModal.classList.add("show");
  converterPy.focus();
}

function hideConverter() {
  converterModal.classList.remove("show");
}

function pyToBs() {
  converterBs.value = reverseTranslate(converterPy.value);
}

function bsToPy() {
  converterPy.value = translate(converterBs.value);
}

function copyConverterBs() {
  converterBs.select();
  document.execCommand("copy");
}

function copyConverterPy() {
  converterPy.select();
  document.execCommand("copy");
}

function insertConverterBsToEditor() {
  editor.value = converterBs.value;
  refreshGutter();
  autosave();
  hideConverter();
  editor.focus();
}

// Close modal on Escape
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && converterModal.classList.contains("show")) {
    hideConverter();
  }
});

// Init
refreshGutter();
</script>
</body>
</html>
